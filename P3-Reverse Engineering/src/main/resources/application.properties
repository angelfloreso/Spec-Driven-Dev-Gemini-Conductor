spring.application.name=p6-reverse-engineering
server.port=8080

# ─── springdoc-openapi settings ────────────────────────────────────────────
# Where the raw JSON spec is served
springdoc.api-docs.path=/v3/api-docs

# Where Swagger UI is served
springdoc.swagger-ui.path=/swagger-ui.html

# Show all operations in Swagger UI expanded by default
springdoc.swagger-ui.operations-sorter=alpha

# Include @Hidden endpoints in scan (set to false to hide internal endpoints)
springdoc.show-actuator=false
